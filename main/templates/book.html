<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{book.name} — BookShop BOMBA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f5f0e8;
            background-image:
                radial-gradient(ellipse at top, #faf6f0 0%, transparent 60%),
                linear-gradient(180deg, #f5f0e8 0%, #ebe4d8 100%);
            min-height: 100vh;
            color: #2c2c2c;
        }

        .header {
            background: #1a1a1a;
            color: #fff;
            padding: 0 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
        }

        .logo span.red { color: #e63946; }
        .logo span.orange {
            color: #f4a261;
            font-size: 18px;
            font-weight: 500;
            margin-left: 8px;
        }

        .nav a {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav a:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .main {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 24px 80px;
        }

        .detail-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 16px 48px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
        }

        .detail-cover {
            width: 280px;
            min-height: 380px;
            background: linear-gradient(145deg, #fff8f0 0%, #f5e6d3 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 28px;
            border-right: 1px solid #eee;
        }

        .detail-cover::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            height: 4px;
            background: linear-gradient(90deg, #e63946, #f4a261);
            border-radius: 2px;
        }

        .detail-id {
            font-size: 13px;
            font-weight: 600;
            color: #e63946;
            margin-bottom: 20px;
        }

        .detail-title-cover {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            color: #1a1a1a;
            margin-bottom: 16px;
        }

        .detail-author-cover {
            font-size: 15px;
            color: #8b5a2b;
            font-style: italic;
        }

        .detail-info {
            flex: 1;
            padding: 48px 40px;
            min-width: 280px;
        }

        .detail-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            margin-bottom: 6px;
        }

        .detail-value {
            font-size: 18px;
            color: #1a1a1a;
            margin-bottom: 28px;
            font-weight: 500;
        }

        .detail-value.title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.25;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #1a1a1a;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #e63946;
            transform: translateY(-1px);
        }

        @media (max-width: 700px) {
            .detail-cover {
                width: 100%;
                min-height: 260px;
                border-right: none;
                border-bottom: 1px solid #eee;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/book-list/" class="logo">
                <span class="red">Book</span>Shop
                <span class="orange"> {{book.user.username}}</span>
            </a>
            <nav class="nav">
                <a href="/book-list/">← Katalog</a>
                <a href="/add-book/">+ Yangi kitob</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="detail-card">
            <div class="detail-cover">
                <div class="detailB-id">#{{book.id}}</div>
                <div class="detail-title-cover">{{book.name}}</div>
                <div class="detail-author-cover">{{book.muallif }}</div>
            </div>
            <div class="detail-info">
                <div class="detail-label">Kitob nomi</div>
                <div class="detail-value title">{{book.name}}</div>

                <div class="detail-label">Muallif</div>
                <div class="detail-value">{{book.user.username}}</div>

                <div class="detail-label">URL</div>
                <div class="detail-value"><a href="https://{{book.url}}">{{book.url}}</a></div>

                <div class="detail-label">Yaratilgan sanasi</div>
                <div class="detail-value">{{book.yaratilgan_sanasi}}</div>

                <a href="/book-list/" class="back-btn">← Katalogga qaytish</a>
            </div>
        </div>
    </main>
</body>
</html>
