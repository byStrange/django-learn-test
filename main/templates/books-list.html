<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookShop BOMBA — Kitoblar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f5f0e8;
            background-image:
                radial-gradient(ellipse at top, #faf6f0 0%, transparent 60%),
                linear-gradient(180deg, #f5f0e8 0%, #ebe4d8 100%);
            min-height: 100vh;
            color: #2c2c2c;
        }

        /* ===== HEADER ===== */
        .header {
            background: #1a1a1a;
            color: #fff;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .logo span.red {
            color: #e63946;
        }

        .logo span.orange {
            color: #f4a261;
            font-size: 18px;
            font-weight: 500;
            margin-left: 8px;
            letter-spacing: 1px;
        }

        .nav {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav a {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav a:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .nav .btn-primary {
            background: #e63946;
            color: #fff !important;
        }

        .nav .btn-primary:hover {
            background: #d62839;
        }

        /* ===== MAIN ===== */
        .main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .page-subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }

        /* ===== BOOK GRID ===== */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 36px 28px;
        }

        /* ===== BOOK CARD (real book look) ===== */
        .book-card {
            text-decoration: none;
            color: inherit;
            display: block;
            perspective: 1000px;
        }

        .book-cover {
            position: relative;
            height: 300px;
            transform-style: preserve-3d;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            cursor: pointer;
        }

        .book-card:hover .book-cover {
            transform: translateY(-12px) rotateY(-6deg);
            box-shadow: 12px 20px 40px rgba(0,0,0,0.25);
        }

        .book-spine {
            position: absolute;
            left: 0;
            top: 0;
            width: 14px;
            height: 100%;
            background: linear-gradient(90deg, #2a2a2a 0%, #444 40%, #2a2a2a 100%);
            border-radius: 3px 0 0 3px;
            box-shadow: inset -2px 0 4px rgba(0,0,0,0.4);
            z-index: 2;
        }

        .book-front {
            position: absolute;
            left: 12px;
            top: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, #fff8f0 0%, #f5e6d3 100%);
            border-radius: 0 6px 6px 0;
            box-shadow:
                4px 6px 16px rgba(0,0,0,0.18),
                inset 0 0 0 1px rgba(0,0,0,0.06);
            padding: 24px 18px 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* dekorativ chiziqlar (kitob qopqog‘i) */
        .book-front::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            height: 3px;
            background: linear-gradient(90deg, #e63946, #f4a261);
            border-radius: 2px;
            opacity: 0.8;
        }

        .book-front::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.04));
            pointer-events: none;
        }

        .book-id {
            font-size: 11px;
            font-weight: 600;
            color: #e63946;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .book-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.3;
            color: #1a1a1a;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .book-author {
            font-size: 13px;
            color: #8b5a2b;
            font-weight: 500;
            margin-bottom: 16px;
            font-style: italic;
        }

        .book-bottom {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.08);
        }

        .book-date {
            font-size: 12px;
            color: #888;
            font-weight: 500;
        }

        /* bo‘sh holat */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #888;
        }

        .empty-state h3 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            margin-bottom: 12px;
            color: #555;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 32px;
            color: #999;
            font-size: 13px;
            border-top: 1px solid #e0d8cc;
            margin-top: 40px;
        }

        /* responsive */
        @media (max-width: 640px) {
            .header-inner {
                height: auto;
                padding: 16px 0;
                flex-direction: column;
                gap: 12px;
            }
            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 24px 16px;
            }
            .book-cover {
                height: 240px;
            }
            .page-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/book-list/" class="logo">
                <span class="red">Book</span>Shop
                <span class="orange">{{request.user.username}}</span>
            </a>
            <nav class="nav">
                <a href="/add-book/" class="btn-primary">+ Yangi kitob</a>
                <a href="/logout/">Chiqish</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <h1 class="page-title">Katalog</h1>
	<p class="page-subtitle">Barcha mavjud kitoblar • {{books.count}} ta</p>

        <div class="books-grid">
        	{% for book in books %}
		<a href="/book/{{book.id}}/" class="book-card">
            <div class="book-cover">
                <div class="book-spine"></div>
                <div class="book-front">
			<div class="book-id">#{{book.id}}</div>
		    <h3 class="book-title">{{book.name}}</h3>
		    <p class="book-author">{{book.muallif}}</p>
                    <div class="book-bottom">
			    <span class="book-date">{{book.yaratilgan_sanasi}}</span>
                    </div>
                </div>
            </div>
        </a>
        {% endfor %}

        </div>
    </main>

    <footer class="footer">
        © 2026 BookShop BOMBA — AtomBomba uslubida
    </footer>
</body>
</html>
